services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lingjing
      POSTGRES_USER: lingjing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingjing -d lingjing"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}'; do sleep 2; done;
      mc mb --ignore-existing local/lingjing-assets;
      exit 0;"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      WORLDFORGE_ENV: production
      WORLDFORGE_AUTH_MODE: required
      WORLDFORGE_AUTO_CREATE_SCHEMA: "0"
      WORLDFORGE_JWT_SECRET: ${WORLDFORGE_JWT_SECRET:?set WORLDFORGE_JWT_SECRET}
      WORLDFORGE_SECURE_COOKIES: ${WORLDFORGE_SECURE_COOKIES:-0}
      WORLDFORGE_CORS_ORIGINS: ${WORLDFORGE_CORS_ORIGINS:-http://localhost:8765}
      WORLDFORGE_TRUSTED_HOSTS: ${WORLDFORGE_TRUSTED_HOSTS:-localhost,127.0.0.1}
      WORLDFORGE_QUEUE_MODE: external
      DATABASE_URL: postgresql+psycopg://lingjing:${POSTGRES_PASSWORD}@postgres:5432/lingjing
      WORLDFORGE_STORAGE_BACKEND: s3
      S3_BUCKET: lingjing-assets
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  api:
    build: .
    environment: *app-env
    ports:
      - "8765:8765"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "worldforge.worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
