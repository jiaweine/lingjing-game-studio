name: Multimodal Context Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  multimodal-context-benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Held-out corpus protocol contract
        run: python scripts/validate_multimodal_corpus.py --protocol-only
      - name: All-modal scope and provenance benchmark
        run: python scripts/multimodal_context_benchmark.py
      - name: Multimodal quality repeat-aggregation smoke
        run: python scripts/multimodal_quality_benchmark.py --repeats 2 --require-zero-contamination
      - name: Multimodal quality matrix rotation smoke
        run: python scripts/multimodal_quality_matrix.py --repeats 2 --require-zero-contamination
