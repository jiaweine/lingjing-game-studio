name: Apply README Release Image Fix

on:
  push:
    branches: [agent/diagnose-readme-browser-images]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/diagnose-readme-browser-images
      - name: Replace README image sources
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          names = [
              'auth', 'workspace-empty', 'upload', 'task-running',
              'workspace', 'evidence', 'multimodal', 'cover',
          ]
          for name in names:
              candidates = [
                  f'./docs/assets/readme/{name}.png',
                  f'https://raw.githubusercontent.com/jiaweine/lingjing-game-studio/main/docs/assets/readme/{name}.png',
              ]
              new = f'https://github.com/jiaweine/lingjing-game-studio/releases/download/readme-gallery-assets/{name}.png'
              for old in candidates:
                  text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff -- README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          if git diff --cached --quiet; then
            echo 'README already uses release asset URLs.'
            exit 0
          fi
          git commit -m 'docs: serve README screenshots from release assets'
          git push origin HEAD:agent/diagnose-readme-browser-images
