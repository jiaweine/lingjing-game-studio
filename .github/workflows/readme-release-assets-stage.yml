name: Stage README Release Assets

on:
  push:
    branches: [agent/diagnose-readme-browser-images]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET_TAG: readme-gallery-assets
    steps:
      - uses: actions/checkout@v6
      - name: Create or update README gallery asset release
        run: |
          if ! gh release view "$ASSET_TAG" >/dev/null 2>&1; then
            gh release create "$ASSET_TAG" \
              --target main \
              --title "README Gallery Assets" \
              --notes "Stable image assets used by the repository README. Managed by automation."
          fi
          gh release upload "$ASSET_TAG" docs/assets/readme/*.png --clobber
          gh release view "$ASSET_TAG" --json url,tagName,assets
