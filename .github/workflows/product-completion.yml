name: Product completion patch

on:
  push:
    branches:
      - agent/product-completion

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-completion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply product completion patch
        run: python scripts/_apply_product_completion.py
      - name: Compile Python
        run: python -m compileall -q worldforge migrations scripts tests
      - name: Run tests
        run: pytest -q
      - name: Check frontend syntax
        run: node --check frontend/app.js
      - name: Commit product completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: complete product lifecycle and collaboration"
            git push origin HEAD:agent/product-completion
          fi
