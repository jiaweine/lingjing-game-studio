name: README Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/product_ui_e2e.py'
      - '.github/workflows/readme-gallery.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET_TAG: readme-gallery-assets
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture product states
        run: python scripts/product_ui_e2e.py
      - name: Verify gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = [
              'auth', 'workspace-empty', 'upload', 'task-running',
              'workspace', 'evidence', 'multimodal', 'cover',
          ]
          for name in names:
              path = Path('docs/assets/readme') / f'{name}.png'
              assert path.is_file() and path.stat().st_size > 0, path
              with Image.open(path) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == (3840, 2400), (name, image.size)
              print(name, path.stat().st_size)
          PY
      - name: Publish stable README image assets
        run: |
          if ! gh release view "$ASSET_TAG" >/dev/null 2>&1; then
            gh release create "$ASSET_TAG" \
              --target main \
              --title 'README Gallery Assets' \
              --notes 'Stable image assets used by the repository README. Managed by README Gallery automation.' \
              --prerelease
          else
            gh release edit "$ASSET_TAG" --prerelease
          fi

          publish_asset() {
            local file="$1"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              echo "Publishing ${file} (attempt ${attempt}/6)"
              if gh release upload "$ASSET_TAG" "$file" --clobber; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            echo "Failed to publish ${file} after 6 attempts" >&2
            return 1
          }

          for file in \
            docs/assets/readme/auth.png \
            docs/assets/readme/workspace-empty.png \
            docs/assets/readme/upload.png \
            docs/assets/readme/task-running.png \
            docs/assets/readme/workspace.png \
            docs/assets/readme/evidence.png \
            docs/assets/readme/multimodal.png \
            docs/assets/readme/cover.png
          do
            publish_asset "$file"
          done

          python - <<'PY'
          import json
          import os
          import subprocess

          names = {
              'auth.png', 'workspace-empty.png', 'upload.png', 'task-running.png',
              'workspace.png', 'evidence.png', 'multimodal.png', 'cover.png',
          }
          data = json.loads(subprocess.check_output([
              'gh', 'release', 'view', os.environ['ASSET_TAG'], '--json', 'assets,isPrerelease,url'
          ], text=True))
          assets = {asset['name']: asset for asset in data['assets']}
          assert names <= set(assets), (names - set(assets))
          assert data['isPrerelease'] is True, data
          for name in names:
              asset = assets[name]
              assert int(asset.get('size') or 0) > 0, asset
              assert asset.get('state') == 'uploaded', asset
          print('release-assets-ok', sorted(names), data['url'])
          PY
      - name: Verify published README images on GitHub
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright

          repository = os.environ['GH_REPOSITORY']
          expected_alts = [
              '灵境游戏研发执行工作台总览',
              '登录与工作空间入口',
              '空任务工作台',
              '多模态素材上传',
              '任务执行状态',
              '任务结果工作台',
              '证据核验',
              '多模态任务上下文',
              '产品总览',
          ]
          url = f'https://github.com/{repository}'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              image_failures = []
              page.on('requestfailed', lambda request: image_failures.append({
                  'url': request.url,
                  'failure': request.failure,
              }) if ('readme-gallery-assets' in request.url.lower() or 'release-assets.githubusercontent.com' in request.url.lower()) else None)
              response = page.goto(url, wait_until='domcontentloaded', timeout=90000)
              assert response and response.status == 200, response.status if response else None

              verified = []
              for alt in expected_alts:
                  deadline = time.monotonic() + 45
                  data = None
                  while time.monotonic() < deadline:
                      data = page.evaluate('''alt => {
                          const img = Array.from(document.images).find(node => node.alt === alt);
                          if (!img) return null;
                          img.scrollIntoView({block: 'center'});
                          return {
                              alt: img.alt,
                              src: img.getAttribute('src'),
                              currentSrc: img.currentSrc,
                              naturalWidth: img.naturalWidth,
                              naturalHeight: img.naturalHeight,
                              complete: img.complete
                          };
                      }''', alt)
                      if data and data['complete'] and data['naturalWidth'] > 0 and data['naturalHeight'] > 0:
                          break
                      page.wait_for_timeout(500)
                  assert data, f'Missing README image node: {alt}'
                  assert data['complete'] and data['naturalWidth'] > 0 and data['naturalHeight'] > 0, data
                  assert 'releases/download/readme-gallery-assets/' in data['src'], data
                  assert data['naturalWidth'] == 3840 and data['naturalHeight'] == 2400, data
                  verified.append(data)
                  print('README-IMAGE', data)

              assert len(verified) == 9, len(verified)
              assert not image_failures, image_failures
              print(f'readme-gallery-browser-ok images={len(verified)} url={url}')
              browser.close()
          PY
      - name: Commit refreshed screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/readme/*.png
          git rm -f docs/assets/readme/providers.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'README screenshots are already current.'
          else
            git commit -m 'docs: refresh product screenshots'
            git push
          fi
