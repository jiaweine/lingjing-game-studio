name: README Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/product_ui_e2e.py'
      - '.github/workflows/readme-gallery.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture product states
        run: python scripts/product_ui_e2e.py
      - name: Verify gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = [
              'auth', 'workspace-empty', 'upload', 'task-running',
              'workspace', 'evidence', 'multimodal', 'cover',
          ]
          for name in names:
              path = Path('docs/assets/readme') / f'{name}.png'
              assert path.is_file() and path.stat().st_size > 0, path
              with Image.open(path) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == (3840, 2400), (name, image.size)
              print(name, path.stat().st_size)
          PY
      - name: Commit refreshed screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/readme/*.png
          git rm -f docs/assets/readme/providers.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'README screenshots are already current.'
          else
            git commit -m 'docs: refresh product screenshots'
            git push
          fi
