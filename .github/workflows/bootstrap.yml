name: Bootstrap Lingjing Game Studio

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/lingjing.b64
          base64 --decode /tmp/lingjing.b64 > /tmp/lingjing.tar.gz
          echo "412363d0c09b3deed23d54c4d6ffb1b5e6269b1811bcc58f4daf9a00b0a26274  /tmp/lingjing.tar.gz" | sha256sum -c -
          tar -xzf /tmp/lingjing.tar.gz -C .
          test -f README.md
          test -f frontend/app.js
          test -f worldforge/api/app.py
          test -f docs/assets/readme/cover.webp

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial release: Lingjing Game Studio"
          git push origin HEAD:main
