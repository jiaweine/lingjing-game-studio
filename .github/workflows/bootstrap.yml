name: Bootstrap Lingjing Game Studio

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/lingjing.b64
          base64 --decode /tmp/lingjing.b64 > /tmp/lingjing.tar.xz
          echo "944b9cb347ce2e320198b11fbcf43484d06bf1da6ae7003661fca45a98642a15  /tmp/lingjing.tar.xz" | sha256sum -c -
          tar -xJf /tmp/lingjing.tar.xz -C .
          test -f README.md
          test -f frontend/app.js
          test -f worldforge/api/app.py
          test -f docs/assets/readme/cover.webp

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial release: Lingjing Game Studio"
          git push origin HEAD:main
