name: README Math Diagnostic

on:
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/readme-math-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify every README equation renders
        env:
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          repo = os.environ['GH_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          url = f'https://github.com/{repo}/tree/{sha}'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              response = page.goto(url, wait_until='domcontentloaded', timeout=90000)
              assert response and response.status == 200
              page.get_by_text('Agent Method · Core Equations', exact=True).scroll_into_view_if_needed()
              page.wait_for_function(
                  '''() => {
                      const nodes = Array.from(document.querySelectorAll('math-renderer.js-display-math'));
                      return nodes.length === 18 && nodes.every(node =>
                          node.querySelector('math') || node.querySelector('.flash-error')
                      );
                  }''',
                  timeout=30000,
              )
              blocks = page.evaluate('''() =>
                  Array.from(document.querySelectorAll('math-renderer.js-display-math')).map((node, index) => ({
                      index,
                      has_mathml: Boolean(node.querySelector('math')),
                      error: node.querySelector('.flash-error')?.textContent?.trim() || '',
                      fallback: node.querySelector('pre')?.textContent?.slice(0, 180) || '',
                  }))
              ''')
              inline_count = page.locator('math-renderer.js-inline-math').count()
              print(json.dumps({'blocks': blocks, 'inline_count': inline_count}, ensure_ascii=False, indent=2))
              assert len(blocks) == 18, blocks
              assert all(item['has_mathml'] for item in blocks), blocks
              assert not any(item['error'] or item['fallback'] for item in blocks), blocks
              print(f'readme-math-ok blocks={len(blocks)} inline={inline_count} url={url}')
              browser.close()
          PY
