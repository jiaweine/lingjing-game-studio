name: Context Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  context-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Context scalability benchmark
        run: python scripts/context_memory_benchmark.py --messages 5000
      - name: Context correctness benchmark
        run: python scripts/context_correctness_benchmark.py
