name: Product control cleanup

on:
  push:
    branches:
      - agent/product-control-cleanup

concurrency:
  group: product-control-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-control-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cleanup
        run: |
          python scripts/_product_cleanup.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/product_ui_e2e.py')
          text = path.read_text(encoding='utf-8')
          old = "if(u.endsWith('/api/jobs/job-e2e/cancel')&&method==='POST') return jsonResponse({id:'job-e2e',status:'cancelled'});\n  }\n  return jsonResponse({detail:'not mocked: '+u},404);"
          new = "if(u.endsWith('/api/jobs/job-e2e/cancel')&&method==='POST') return jsonResponse({id:'job-e2e',status:'cancelled'});\n  return jsonResponse({detail:'not mocked: '+u},404);"
          if old not in text:
              raise SystemExit('expected E2E mock cleanup pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
      - name: Validate
        run: |
          python -m compileall -q worldforge migrations scripts tests
          pytest -q
          node --check frontend/app.js
          python scripts/product_ui_e2e.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: tighten product control and remove dead UI"
          git push origin HEAD:agent/product-control-cleanup
