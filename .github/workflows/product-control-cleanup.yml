name: Product control cleanup

on:
  push:
    branches:
      - agent/product-control-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-control-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cleanup
        run: python scripts/_product_cleanup.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate
        run: |
          python -m compileall -q worldforge migrations scripts tests
          pytest -q
          node --check frontend/app.js
          python scripts/product_ui_e2e.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: tighten product control and remove dead UI"
          git push origin HEAD:agent/product-control-cleanup
