name: README Browser Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect fixed branch README images
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          expected_alts = [
              '灵境游戏研发执行工作台总览',
              '登录与工作空间入口',
              '空任务工作台',
              '多模态素材上传',
              '任务执行状态',
              '任务结果工作台',
              '证据核验',
              '多模态任务上下文',
              '产品总览',
          ]
          url = 'https://github.com/jiaweine/lingjing-game-studio/tree/agent/diagnose-readme-browser-images'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = context.new_page()
              image_responses = []
              failed_requests = []

              page.on('requestfailed', lambda request: failed_requests.append({
                  'url': request.url,
                  'failure': request.failure,
              }))

              def capture_response(response):
                  u = response.url.lower()
                  if ('readme-gallery-assets' in u or
                      'release-assets.githubusercontent.com' in u or
                      'objects.githubusercontent.com' in u):
                      image_responses.append({
                          'url': response.url,
                          'status': response.status,
                          'content_type': response.headers.get('content-type'),
                      })

              page.on('response', capture_response)
              response = page.goto(url, wait_until='domcontentloaded', timeout=90000)
              print('page-status', response.status if response else None)
              assert response and response.status == 200

              final_images = []
              for alt in expected_alts:
                  locator = page.locator(f'img[alt="{alt}"]').first
                  locator.wait_for(state='attached', timeout=30000)
                  locator.scroll_into_view_if_needed(timeout=30000)
                  page.wait_for_function(
                      '(img) => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0',
                      arg=locator.element_handle(),
                      timeout=45000,
                  )
                  data = locator.evaluate('''img => ({
                      alt: img.alt,
                      src: img.getAttribute('src'),
                      currentSrc: img.currentSrc,
                      naturalWidth: img.naturalWidth,
                      naturalHeight: img.naturalHeight,
                      complete: img.complete
                  })''')
                  final_images.append(data)
                  print('README-IMAGE', data)
                  assert 'readme-gallery-assets' in data['src'], data
                  assert data['naturalWidth'] == 3840 and data['naturalHeight'] == 2400, data

              for item in image_responses:
                  print('IMAGE-RESPONSE', item)
              for failure in failed_requests:
                  if ('readme-gallery-assets' in failure['url'].lower() or
                      'release-assets.githubusercontent.com' in failure['url'].lower()):
                      print('FAILED-REQUEST', failure)

              image_failures = [
                  f for f in failed_requests
                  if ('readme-gallery-assets' in f['url'].lower() or
                      'release-assets.githubusercontent.com' in f['url'].lower())
              ]
              print('image-failures', image_failures)
              print('verified-images', len(final_images))
              assert len(final_images) == 9, len(final_images)
              assert not image_failures, image_failures
              browser.close()
          PY
