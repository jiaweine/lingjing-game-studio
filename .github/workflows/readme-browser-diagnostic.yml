name: README Browser Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public repository README images
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          expected_alts = {
              '灵境游戏研发执行工作台总览',
              '登录与工作空间入口',
              '空任务工作台',
              '多模态素材上传',
              '任务执行状态',
              '任务结果工作台',
              '证据核验',
              '多模态任务上下文',
              '产品总览',
          }
          url = 'https://github.com/jiaweine/lingjing-game-studio'
          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = context.new_page()
              failed_requests = []
              image_responses = []
              page.on('requestfailed', lambda request: failed_requests.append({
                  'url': request.url,
                  'failure': request.failure,
              }))
              def capture_response(response):
                  u = response.url.lower()
                  if '/raw/main/docs/assets/readme/' in u or 'raw.githubusercontent.com' in u:
                      image_responses.append({
                          'url': response.url,
                          'status': response.status,
                          'content_type': response.headers.get('content-type'),
                          'location': response.headers.get('location'),
                      })
              page.on('response', capture_response)
              response = page.goto(url, wait_until='domcontentloaded', timeout=90000)
              print('page-status', response.status if response else None)
              page.wait_for_timeout(10000)
              images = page.locator('img').evaluate_all('''imgs => imgs.map(img => ({
                  alt: img.alt,
                  src: img.getAttribute('src'),
                  currentSrc: img.currentSrc,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  complete: img.complete
              }))''')
              targets = [img for img in images if img.get('alt') in expected_alts]
              print('target-count', len(targets))
              for img in targets:
                  print('README-IMAGE', img)
              for item in image_responses:
                  print('IMAGE-RESPONSE', item)
              for failure in failed_requests:
                  if '.png' in failure['url'].lower() or 'raw.githubusercontent' in failure['url'].lower():
                      print('FAILED-REQUEST', failure)
              seen = set()
              for img in targets:
                  src = img.get('currentSrc')
                  if not src or src in seen:
                      continue
                  seen.add(src)
                  direct = context.request.get(src, timeout=30000, fail_on_status_code=False)
                  body = direct.body()
                  print('DIRECT-IMAGE', {
                      'url': src,
                      'status': direct.status,
                      'content_type': direct.headers.get('content-type'),
                      'content_length': direct.headers.get('content-length'),
                      'first_bytes_hex': body[:24].hex(),
                      'text_prefix': body[:120].decode('utf-8', errors='replace').replace('\n', ' '),
                  })
              missing = sorted(expected_alts - {img.get('alt') for img in targets})
              broken = [img for img in targets if not img.get('complete') or int(img.get('naturalWidth') or 0) <= 0]
              print('missing-alts', missing)
              print('broken-images', broken)
              browser.close()
              assert not missing, f'Missing README images in public repository DOM: {missing}'
              assert not broken, f'Broken README images in public repository DOM: {broken}'
          PY
