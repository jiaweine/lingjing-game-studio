name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall -q worldforge migrations scripts tests
      - name: Test suite
        run: pytest -q
      - name: JavaScript syntax check
        run: node --check frontend/app.js

# Clean-install CI: requirements.txt is the source of truth for runtime and test dependencies.
