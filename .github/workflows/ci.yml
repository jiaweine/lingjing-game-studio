name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall -q worldforge migrations scripts tests
      - name: Test suite
        run: pytest -q
      - name: JavaScript syntax check
        run: node --check frontend/app.js
      - name: Backend product E2E
        run: python scripts/product_backend_e2e.py
      - name: README and repository consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          readme = Path('README.md').read_text(encoding='utf-8')
          screenshots = [
              'auth', 'workspace-empty', 'upload', 'task-running',
              'workspace', 'evidence', 'multimodal', 'cover',
          ]
          for name in screenshots:
              rel = f'docs/assets/readme/{name}.png'
              markdown_ref = f'](/{rel})'
              assert markdown_ref in readme, f'README missing Markdown image reference: {markdown_ref}'
              path = Path(rel)
              assert path.is_file() and path.stat().st_size > 0, path
              with Image.open(path) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == (3840, 2400), (name, image.size)

          assert '<img ' not in readme, 'README screenshots must use GitHub Markdown image syntax, not raw HTML img tags'
          assert not Path('frontend/.readme-gallery-trigger').exists()
          stale = {
              'BUILD_REPORT.md': ['v2.0', 'UI v3', '16 passed', '7 / 7 PASS'],
              'docs/ARCHITECTURE.md': ['SaaS Control Plane（v2.0）', '本项目只启用自研本地模型'],
              'docs/FRONTEND.md': ['决策空间', '轨迹回放', '策略演进', '评测报告'],
              'SECURITY.md': ['The v2 SaaS control-plane code'],
              'Makefile': ['train_worldforge_m1.py'],
          }
          for filename, tokens in stale.items():
              text = Path(filename).read_text(encoding='utf-8')
              for token in tokens:
                  assert token not in text, f'{filename} still contains stale token: {token}'
          PY
      - name: GitHub README render smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          expected = [
              'auth', 'workspace-empty', 'upload', 'task-running',
              'workspace', 'evidence', 'multimodal', 'cover',
          ]
          repository = os.environ['GH_REPOSITORY']
          sha = os.environ['GH_SHA']
          token = os.environ['GH_TOKEN']
          readme = Path('README.md').read_text(encoding='utf-8')

          payload = json.dumps({
              'text': readme,
              'mode': 'gfm',
              'context': repository,
          }).encode('utf-8')
          request = urllib.request.Request(
              'https://api.github.com/markdown',
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'User-Agent': 'lingjing-readme-render-check',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              rendered = response.read().decode('utf-8')
              assert response.status == 200

          class ImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'img':
                      self.images.append(dict(attrs))

          parser = ImageParser()
          parser.feed(rendered)
          assert len(parser.images) >= 8, f'GitHub rendered only {len(parser.images)} image tags'

          rendered_attrs = [
              unquote(' '.join(str(value) for value in attrs.values() if value))
              for attrs in parser.images
          ]
          for name in expected:
              filename = f'{name}.png'
              assert any(filename in attrs for attrs in rendered_attrs), f'GitHub render missing {filename}'

          for name in expected:
              url = f'https://raw.githubusercontent.com/{repository}/{sha}/docs/assets/readme/{name}.png'
              image_request = urllib.request.Request(url, headers={'User-Agent': 'lingjing-readme-render-check'})
              with urllib.request.urlopen(image_request, timeout=30) as response:
                  header = response.read(8)
                  assert response.status == 200, (name, response.status)
                  assert response.headers.get_content_type() == 'image/png', (name, response.headers.get('Content-Type'))
                  assert header == b'\x89PNG\r\n\x1a\n', f'{name} is not a readable PNG'

          print(f'github-readme-render-ok images={len(parser.images)} assets={len(expected)}')
          PY

  product-ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser product E2E
        run: python scripts/product_ui_e2e.py
      # README Gallery is refreshed separately by .github/workflows/readme-gallery.yml on main.
