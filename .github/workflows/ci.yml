name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall -q worldforge migrations scripts tests
      - name: Test suite
        run: pytest -q
      - name: Harness self-evolution benchmark
        run: python scripts/harness_evolution_benchmark.py
      - name: JavaScript syntax check
        run: node --check frontend/app.js
      - name: Backend product E2E
        run: python scripts/product_backend_e2e.py
      - name: README and repository consistency
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote
          from PIL import Image

          names = [
              'auth', 'workspace-empty', 'upload', 'task-running',
              'workspace', 'evidence', 'multimodal', 'cover',
          ]
          repository = os.environ['GH_REPOSITORY']
          ref = os.environ['SOURCE_SHA']
          token = os.environ['GH_TOKEN']
          asset_prefix = f'https://github.com/{repository}/releases/download/readme-gallery-assets/'
          api = f'https://api.github.com/repos/{repository}'
          readme = Path('README.md').read_text(encoding='utf-8')

          for name in names:
              rel = f'docs/assets/readme/{name}.png'
              expected_url = f'{asset_prefix}{name}.png'
              markdown_ref = f']({expected_url})'
              assert markdown_ref in readme, f'README missing stable release image URL: {markdown_ref}'
              path = Path(rel)
              assert path.is_file() and path.stat().st_size > 0, path
              with Image.open(path) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == (3840, 2400), (name, image.size)

          assert readme.count('```math\n') == 18, 'README must expose exactly 18 display equations'
          assert r'\operatorname{' not in readme, 'GitHub MathJax rejects operatorname in this README'
          assert '](/docs/' not in readme, 'README must not use GitHub site-root image paths'
          assert '](./docs/assets/readme/' not in readme, 'README must not depend on GitHub /raw route rewriting'
          assert 'raw.githubusercontent.com/jiaweine/lingjing-game-studio/' not in readme, 'README must use stable release assets, not raw CDN links'
          assert '<img ' not in readme, 'README screenshots must use Markdown image syntax, not raw HTML img tags'
          assert not Path('frontend/.readme-gallery-trigger').exists()

          stale = {
              'BUILD_REPORT.md': ['v2.0', 'UI v3', '16 passed', '7 / 7 PASS'],
              'docs/ARCHITECTURE.md': ['SaaS Control Plane（v2.0）', '本项目只启用自研本地模型'],
              'docs/FRONTEND.md': ['决策空间', '轨迹回放', '策略演进', '评测报告'],
              'SECURITY.md': ['The v2 SaaS control-plane code'],
              'Makefile': ['train_worldforge_m1.py'],
          }
          for filename, tokens in stale.items():
              text = Path(filename).read_text(encoding='utf-8')
              for stale_token in tokens:
                  assert stale_token not in text, f'{filename} still contains stale token: {stale_token}'

          common_headers = {
              'Authorization': f'Bearer {token}',
              'User-Agent': 'lingjing-readme-check',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          readme_url = f'{api}/contents/README.md?ref={urllib.parse.quote(ref, safe="")}'
          request = urllib.request.Request(
              readme_url,
              headers={**common_headers, 'Accept': 'application/vnd.github.html+json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              rendered = response.read().decode('utf-8')
              assert response.status == 200

          class ImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'img':
                      self.images.append(dict(attrs))

          parser = ImageParser()
          parser.feed(rendered)
          rendered_values = [
              unquote(' '.join(str(value) for value in attrs.values() if value))
              for attrs in parser.images
          ]
          for name in names:
              expected_url = f'{asset_prefix}{name}.png'
              assert any(expected_url in values for values in rendered_values), f'GitHub render missing {expected_url}'

          for name in names:
              path = f'docs/assets/readme/{name}.png'
              asset_url = f'{api}/contents/{path}?ref={urllib.parse.quote(ref, safe="")}'
              request = urllib.request.Request(
                  asset_url,
                  headers={**common_headers, 'Accept': 'application/vnd.github.raw+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200, (name, response.status)
                  assert response.read(8) == b'\x89PNG\r\n\x1a\n', f'{name} is not a readable PNG in the repository'

          release_url = f'{api}/releases/tags/readme-gallery-assets'
          request = urllib.request.Request(
              release_url,
              headers={**common_headers, 'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.loads(response.read().decode('utf-8'))
              assert response.status == 200
          release_assets = {asset['name']: asset for asset in release.get('assets', [])}
          for name in names:
              filename = f'{name}.png'
              assert filename in release_assets, f'Release asset missing: {filename}'
              asset = release_assets[filename]
              assert asset.get('state') == 'uploaded', asset
              assert int(asset.get('size') or 0) > 0, asset
              assert asset.get('browser_download_url') == f'{asset_prefix}{filename}', asset

          print(f'readme-static-ok rendered_images={len(parser.images)} release_assets={len(release_assets)} ref={ref}')
          PY

  product-ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser product E2E
        run: python scripts/product_ui_e2e.py
      - name: README browser visibility
        env:
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright

          repository = os.environ['GH_REPOSITORY']
          source_sha = os.environ['SOURCE_SHA']
          event_name = os.environ['EVENT_NAME']
          expected_alts = [
              '灵境游戏研发执行工作台总览',
              '登录与工作空间入口',
              '空任务工作台',
              '多模态素材上传',
              '任务执行状态',
              '任务结果工作台',
              '证据核验',
              '多模态任务上下文',
              '产品总览',
          ]
          if event_name == 'push':
              url = f'https://github.com/{repository}'
          else:
              url = f'https://github.com/{repository}/tree/{source_sha}'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              image_failures = []
              page.on('requestfailed', lambda request: image_failures.append({
                  'url': request.url,
                  'failure': request.failure,
              }) if ('readme-gallery-assets' in request.url.lower() or 'release-assets.githubusercontent.com' in request.url.lower()) else None)
              response = page.goto(url, wait_until='domcontentloaded', timeout=90000)
              assert response and response.status == 200, response.status if response else None

              verified = []
              for alt in expected_alts:
                  deadline = time.monotonic() + 45
                  data = None
                  while time.monotonic() < deadline:
                      data = page.evaluate('''alt => {
                          const img = Array.from(document.images).find(node => node.alt === alt);
                          if (!img) return null;
                          img.scrollIntoView({block: 'center'});
                          return {
                              alt: img.alt,
                              src: img.getAttribute('src'),
                              currentSrc: img.currentSrc,
                              naturalWidth: img.naturalWidth,
                              naturalHeight: img.naturalHeight,
                              complete: img.complete
                          };
                      }''', alt)
                      if data and data['complete'] and data['naturalWidth'] > 0 and data['naturalHeight'] > 0:
                          break
                      page.wait_for_timeout(500)
                  assert data, f'Missing README image node: {alt}'
                  assert data['complete'] and data['naturalWidth'] > 0 and data['naturalHeight'] > 0, data
                  assert 'releases/download/readme-gallery-assets/' in data['src'], data
                  assert data['naturalWidth'] == 3840 and data['naturalHeight'] == 2400, data
                  verified.append(data)
                  print('README-IMAGE', data)

              assert len(verified) == 9, len(verified)
              assert not image_failures, image_failures

              math_deadline = time.monotonic() + 45
              math_state = None
              while time.monotonic() < math_deadline:
                  math_state = page.evaluate('''() => {
                      const renderers = Array.from(document.querySelectorAll('math-renderer'));
                      const mathml = renderers.filter(node => node.querySelector('math')).length;
                      const rawBlocks = Array.from(document.querySelectorAll('pre code')).filter(node =>
                          (node.className || '').includes('language-math')
                      ).length;
                      const bodyText = document.body.innerText || '';
                      return {
                          renderers: renderers.length,
                          mathml,
                          rawBlocks,
                          macroError: bodyText.includes('The following macros are not allowed') || bodyText.includes('ParseError')
                      };
                  }''')
                  if math_state['mathml'] >= 18 and not math_state['macroError']:
                      break
                  page.wait_for_timeout(500)
              assert math_state['renderers'] >= 18, math_state
              assert math_state['mathml'] >= 18, math_state
              assert math_state['rawBlocks'] == 0, math_state
              assert not math_state['macroError'], math_state

              print(f'readme-browser-ok images={len(verified)} math={math_state} url={url}')
              browser.close()
          PY
      # README Gallery is refreshed separately by .github/workflows/readme-gallery.yml on main.
