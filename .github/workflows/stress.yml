name: Stress smoke

on:
  push:
    branches: [audit/stress-readme-hardening-20260821]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Stress hardening regressions
        run: >-
          pytest -q
          tests/test_stress_hardening.py
          tests/test_fanout.py
          tests/test_production_config.py
          tests/test_product_metrics.py
          tests/test_worker_queue.py
          tests/test_migrations.py
          tests/test_context_bounds.py
      - name: Bounded API concurrency smoke
        run: python scripts/stress_smoke.py
