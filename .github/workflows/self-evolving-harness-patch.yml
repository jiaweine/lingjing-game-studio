name: Self-evolving harness patch

on:
  push:
    branches:
      - agent/self-evolving-harness

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/self-evolving-harness
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch runtime integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worldforge/runtime/engine.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'from .evolver import FailureDrivenEvolver\n',
              'from .harness_evolution import HarnessEvolutionEngine, TraceReflector\n'
              'from .harness_genome import HarnessGenomeStore\n',
          )
          text = text.replace(
              '        db_path = Path(db_path)\n        self.events = EventStore(db_path)\n',
              '        db_path = Path(db_path)\n'
              '        self.harness_path = db_path.with_name("worldforge_harness.json")\n'
              '        HarnessGenomeStore.configure(self.harness_path)\n'
              '        self.events = EventStore(db_path)\n',
          )
          text = text.replace(
              '        self.brancher = CounterfactualBrancher(self.planner, self.verifier)\n'
              '        self.evolver = FailureDrivenEvolver(self.skills)\n'
              '        self.sandbox = ActionSandbox()\n',
              '        self.brancher = CounterfactualBrancher(self.planner, self.verifier)\n'
              '        self.harness_evolver = HarnessEvolutionEngine(\n'
              '            archive_path=db_path.with_name("worldforge_harness_archive.json")\n'
              '        )\n'
              '        self.sandbox = ActionSandbox()\n',
          )
          old_mount = '''        self.plugins.mount(
              PluginDescriptor(
                  "failure-evolver", "evolution",
                  dependencies=("skill-bank", "state-verifier"),
                  metadata={"regression_gate": True},
              ),
              self.evolver,
          )
'''
          new_mount = '''        self.plugins.mount(
              PluginDescriptor(
                  "harness-genome", "harness",
                  dependencies=("world-state", "state-verifier"),
                  metadata={
                      "self_evolving": True,
                      "frozen_kernel": True,
                      **HarnessGenomeStore.current().card(),
                  },
              ),
              HarnessGenomeStore.current(),
          )
          self.plugins.mount(
              PluginDescriptor(
                  "harness-evolution", "evolution",
                  dependencies=("harness-genome", "state-verifier"),
                  metadata={
                      "search": "semantic-qd-pareto",
                      "heldout_gate": True,
                      "topology_search": True,
                      "meta_mutation": True,
                  },
              ),
              self.harness_evolver,
          )
'''
          if old_mount not in text:
              raise SystemExit('failure-evolver mount block not found')
          text = text.replace(old_mount, new_mount)
          text = text.replace(
              '            "policy": run_policy.card_dict(),\n'
              '            "product_mode": "game-autonomous-testing",\n',
              '            "policy": run_policy.card_dict(),\n'
              '            "harness": HarnessGenomeStore.current().card(),\n'
              '            "product_mode": "game-autonomous-testing",\n',
          )
          text = text.replace(
              '            active_skills = run_skills.active_for(state, belief.uncertainty)\n',
              '            active_skills = run_skills.active_for(\n'
              '                state, belief.uncertainty, goal=goal\n'
              '            )\n',
          )
          old_branch = '''                branches = brancher.evaluate(
                    env,
                    ranked.candidates,
                    goal,
                    width=config.branch_width,
                    horizon=config.rollout_horizon,
                    rollouts=config.rollouts_per_branch,
                )
'''
          new_branch = '''                search_width, search_horizon, search_rollouts = (
                    HarnessGenomeStore.current().search.allocate(
                        uncertainty=belief.uncertainty,
                        threat=state.threat,
                        width_cap=config.branch_width,
                        horizon_cap=config.rollout_horizon,
                        rollout_cap=config.rollouts_per_branch,
                    )
                )
                branches = brancher.evaluate(
                    env,
                    ranked.candidates,
                    goal,
                    width=search_width,
                    horizon=search_horizon,
                    rollouts=search_rollouts,
                )
'''
          if old_branch not in text:
              raise SystemExit('counterfactual branch block not found')
          text = text.replace(old_branch, new_branch)
          text = text.replace(
              '                    "branch_width": config.branch_width,\n'
              '                    "rollout_horizon": config.rollout_horizon,\n'
              '                    "rollouts_per_branch": config.rollouts_per_branch,\n',
              '                    "branch_width": search_width,\n'
              '                    "rollout_horizon": search_horizon,\n'
              '                    "rollouts_per_branch": search_rollouts,\n'
              '                    "budget_caps": {\n'
              '                        "branch_width": config.branch_width,\n'
              '                        "rollout_horizon": config.rollout_horizon,\n'
              '                        "rollouts_per_branch": config.rollouts_per_branch,\n'
              '                    },\n',
          )

          start = text.index('            if config.enable_evolution:\n                signal = self.evolver.attribute(')
          end = text.index('                if policy_groups:\n', start)
          harness_block = '''            if config.enable_evolution:
                final_belief = planner.make_belief(state)
                evidence = TraceReflector.diagnose(
                    state=state,
                    belief=final_belief,
                    goal=goal,
                    outcome=state.outcome,
                    anomalies=env.anomalies,
                    invalid_actions=summary.invalid_actions,
                    action_counts=dict(action_counter),
                )
                should_evolve_harness = bool(
                    state.outcome != "victory"
                    or env.anomalies
                    or summary.recovery_events
                    or summary.invalid_actions
                )
                if should_evolve_harness:
                    harness_result = await asyncio.to_thread(
                        self.harness_evolver.evolve,
                        evidence,
                    )
                    evolved = evolved or harness_result.promoted
                    await self._emit(
                        session_id,
                        "harness.evolution",
                        harness_result.to_dict(),
                        sink,
                    )
                    if harness_result.promoted:
                        self.plugins.mount(
                            PluginDescriptor(
                                "harness-genome",
                                "harness",
                                dependencies=("world-state", "state-verifier"),
                                metadata={
                                    "self_evolving": True,
                                    "frozen_kernel": True,
                                    **HarnessGenomeStore.current().card(),
                                },
                            ),
                            HarnessGenomeStore.current(),
                        )

'''
          text = text[:start] + harness_block + text[end:]
          text = text.replace(
              '            "policy": self.policy_model.card_dict(),\n'
              '            "findings": env.anomalies,\n',
              '            "policy": self.policy_model.card_dict(),\n'
              '            "harness": HarnessGenomeStore.current().card(),\n'
              '            "findings": env.anomalies,\n',
          )
          path.write_text(text, encoding='utf-8')

          init_path = Path('worldforge/runtime/__init__.py')
          init_text = init_path.read_text(encoding='utf-8')
          if 'harness_genome import' not in init_text:
              init_text += (
                  'from .harness_genome import HarnessGenome, HarnessGenomeStore, LinearGate, SpecialistGene\n'
                  'from .harness_evolution import HarnessEvolutionEngine, EvolutionConfig, EvolutionEvidence, TraceReflector\n'
              )
          init_text = init_text.replace('from .evolver import FailureDrivenEvolver\n', '')
          init_path.write_text(init_text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate patched runtime
        run: |
          python -m compileall worldforge tests
          pytest -q tests/test_runtime.py tests/test_readme_math.py
      - name: Commit runtime integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worldforge/runtime/engine.py worldforge/runtime/__init__.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Integrate self-evolving harness runtime"
            git push origin HEAD:agent/self-evolving-harness
          fi
