name: Apply README Math Fix

on:
  pull_request:
    paths:
      - '.github/workflows/readme-math-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-readme-math-rendering
      - name: Fix unsupported math macros and add permanent render gate
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')

          # GitHub's math renderer rejects \operatorname. Keep the exact
          # mathematical meaning while using macros accepted by GitHub MathJax.
          readme = readme.replace(r'\operatorname{clip}', r'\mathrm{clip}')
          readme = readme.replace(r'\operatorname{Std}', r'\mathrm{Std}')

          inline_replacements = {
              '`b_j(a)`': '$b_j(a)$',
              '`c_j`': '$c_j$',
              r'`\mathcal{A}(s)`': r'$\mathcal{A}(s)$',
              '每个合法动作 `a`': '每个合法动作 $a$',
              '`v_i(a)`': '$v_i(a)$',
              '`B_skill(a)`': r'$B_{\mathrm{skill}}(a)$',
              '`M(s,a)`': '$M(s,a)$',
              '`Z_θ(a|s)`': r'$Z_{\theta}(a\mid s)$',
              '`B_agent(a)`': r'$B_{\mathrm{agent}}(a)$',
              '`E(a)`': '$E(a)$',
              '`R_repeat(a)`': r'$R_{\mathrm{repeat}}(a)$',
              '`u` 是 belief uncertainty，`T(a)`': '$u$ 是 belief uncertainty，$T(a)$',
              r'`\tau` 是 threat': r'$\tau$ 是 threat',
              '`r_k`：': '$r_k$：',
              '`e_k`：': '$e_k$：',
              '`h_k`：': '$h_k$：',
              '`g_k`：': '$g_k$：',
              r'`\tau_k`：': r'$\tau_k$：',
              r'`\rho`：': r'$\rho$：',
              r'`\mathcal{V}_k`：': r'$\mathcal{V}_k$：',
              r'合法动作集合 `\mathcal{L}(s)`': r'合法动作集合 $\mathcal{L}(s)$',
              r'默认 `\epsilon = 0.18`': r'默认 $\epsilon=0.18$',
          }
          for old, new in inline_replacements.items():
              readme = readme.replace(old, new)

          readme = readme.replace(
              '为了避免 GitHub 页面把公式当普通文本，块公式统一使用 GitHub 原生 `math` fenced block。',
              '块公式使用 GitHub 原生 `math` fenced block；正文中的变量与符号使用 inline math。所有公式都必须通过仓库首页的真实 MathML 渲染门禁。'
          )
          assert r'\operatorname{' not in readme, 'unsupported operatorname macro remains'
          readme_path.write_text(readme, encoding='utf-8')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          old = """              assert len(verified) == 9, len(verified)\n              assert not image_failures, image_failures\n              print(f'readme-browser-ok images={len(verified)} url={url}')\n"""
          new = """              assert len(verified) == 9, len(verified)\n              assert not image_failures, image_failures\n\n              # Math is part of the public README surface. GitHub may accept\n              # Markdown syntax while rejecting individual LaTeX macros, so\n              # require every declared display equation to become MathML.\n              page.get_by_text('Agent Method · Core Equations', exact=True).scroll_into_view_if_needed()\n              page.wait_for_function(\n                  \"\"\"() => {\n                      const nodes = Array.from(document.querySelectorAll('math-renderer.js-display-math'));\n                      return nodes.length === 18 && nodes.every(node =>\n                          node.querySelector('math') || node.querySelector('.flash-error')\n                      );\n                  }\"\"\",\n                  timeout=30000,\n              )\n              math_blocks = page.evaluate(\"\"\"() =>\n                  Array.from(document.querySelectorAll('math-renderer.js-display-math')).map((node, index) => ({\n                      index,\n                      has_mathml: Boolean(node.querySelector('math')),\n                      error: node.querySelector('.flash-error')?.textContent?.trim() || '',\n                      fallback: node.querySelector('pre')?.textContent?.slice(0, 160) || '',\n                  }))\n              \"\"\")\n              assert len(math_blocks) == 18, math_blocks\n              assert all(block['has_mathml'] for block in math_blocks), math_blocks\n              assert not any(block['error'] or block['fallback'] for block in math_blocks), math_blocks\n              print(f'readme-math-ok blocks={len(math_blocks)}')\n              print(f'readme-browser-ok images={len(verified)} url={url}')\n"""
          assert old in ci, 'README browser gate anchor not found'
          ci = ci.replace(old, new, 1)
          ci_path.write_text(ci, encoding='utf-8')

          # Diagnostic helpers are intentionally not part of the product tree.
          for path in [
              Path('.github/workflows/readme-math-diagnostic.yml'),
              Path('.github/workflows/readme-math-fix.yml'),
          ]:
              if path.exists():
                  path.unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/ci.yml .github/workflows/readme-math-diagnostic.yml .github/workflows/readme-math-fix.yml
          git commit -m "Fix GitHub math rendering and verify equations"
          git push origin HEAD:agent/fix-readme-math-rendering
