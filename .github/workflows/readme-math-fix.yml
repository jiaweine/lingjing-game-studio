name: Apply README Math Fix

on:
  pull_request:
    paths:
      - '.github/workflows/readme-math-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-readme-math-rendering
      - name: Fix unsupported math macros and inline notation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(r'\operatorname{clip}', r'\mathrm{clip}')
          text = text.replace(r'\operatorname{Std}', r'\mathrm{Std}')

          replacements = {
              '`b_j(a)`': '$b_j(a)$',
              '`c_j`': '$c_j$',
              r'`\mathcal{A}(s)`': r'$\mathcal{A}(s)$',
              '每个合法动作 `a`': '每个合法动作 $a$',
              '`v_i(a)`': '$v_i(a)$',
              '`B_skill(a)`': r'$B_{\mathrm{skill}}(a)$',
              '`M(s,a)`': '$M(s,a)$',
              '`Z_θ(a|s)`': r'$Z_{\theta}(a\mid s)$',
              '`B_agent(a)`': r'$B_{\mathrm{agent}}(a)$',
              '`E(a)`': '$E(a)$',
              '`R_repeat(a)`': r'$R_{\mathrm{repeat}}(a)$',
              '`u` 是 belief uncertainty，`T(a)`': '$u$ 是 belief uncertainty，$T(a)$',
              r'`\tau` 是 threat': r'$\tau$ 是 threat',
              '`r_k`：': '$r_k$：',
              '`e_k`：': '$e_k$：',
              '`h_k`：': '$h_k$：',
              '`g_k`：': '$g_k$：',
              r'`\tau_k`：': r'$\tau_k$：',
              r'`\rho`：': r'$\rho$：',
              r'`\mathcal{V}_k`：': r'$\mathcal{V}_k$：',
              r'合法动作集合 `\mathcal{L}(s)`': r'合法动作集合 $\mathcal{L}(s)$',
              r'默认 `\epsilon = 0.18`': r'默认 $\epsilon=0.18$',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          text = text.replace(
              '为了避免 GitHub 页面把公式当普通文本，块公式统一使用 GitHub 原生 `math` fenced block。',
              '块公式使用 GitHub 原生 `math` fenced block；正文中的变量与符号使用 inline math。公式展示以 GitHub 实际 MathML 渲染结果为准。'
          )
          assert r'\operatorname{' not in text
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit README fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix GitHub math rendering in README"
          git push origin HEAD:agent/fix-readme-math-rendering
