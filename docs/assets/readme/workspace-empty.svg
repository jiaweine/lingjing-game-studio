<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750"><rect width="1200" height="750" fill="#0d1016"/><rect x="35" y="35" width="1130" height="680" rx="20" fill="#12161d" stroke="#2a303a"/><rect x="35" y="35" width="210" height="680" rx="20" fill="#0f1218"/><text x="70" y="90" fill="#f4f6fb" font-family="Arial" font-size="24" font-weight="700">Lingjing</text><text x="290" y="115" fill="#f4f6fb" font-family="Arial" font-size="28" font-weight="700">Start an investigation</text><text x="290" y="150" fill="#8992a4" font-family="Arial" font-size="15">Bring gameplay evidence into one focused workspace.</text><rect x="290" y="205" width="560" height="175" rx="16" fill="#171c25" stroke="#343b48"/><text x="325" y="250" fill="#9c94ff" font-family="Arial" font-size="13">PRIMARY TASK</text><text x="325" y="292" fill="#f6f7fb" font-family="Arial" font-size="23" font-weight="700">Investigate a gameplay issue</text><text x="325" y="325" fill="#8d96a8" font-family="Arial" font-size="14">Upload screenshots, video and logs, then ask what happened.</text><rect x="325" y="345" width="150" height="36" rx="9" fill="#6d5dfc"/><text x="352" y="369" fill="white" font-family="Arial" font-size="13">Create task</text><rect x="290" y="410" width="260" height="135" rx="15" fill="#151922"/><rect x="570" y="410" width="260" height="135" rx="15" fill="#151922"/><rect x="850" y="205" width="270" height="340" rx="16" fill="#10141b" stroke="#2a303a"/><text x="880" y="250" fill="#f4f6fb" font-family="Arial" font-size="16" font-weight="700">Inspector</text><text x="880" y="290" fill="#7e8799" font-family="Arial" font-size="13">Evidence appears here after</text><text x="880" y="312" fill="#7e8799" font-family="Arial" font-size="13">analysis begins.</text></svg>